name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 runners ship AppArmor's unprivileged-userns restriction,
      # which makes bwrap --unshare-all fail. Turn it off, as production hosts
      # do, and check that bwrap starts, so a breakage fails on this step
      # instead of as a dozen unclear test failures.
      # Runners have no cgroup delegation and no PMU, so those asserts skip;
      # the isolation and rlimit tests still run for real.
      - name: Enable unprivileged user namespaces (bwrap needs them)
        # Same mounts as tallyrun: a bare bwrap root has no /bin, and without
        # /lib64 there's no ELF loader.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --symlink usr/bin /bin -- /bin/true && echo "bwrap sandbox OK"
      - run: cargo build --release
      - run: cargo test --release
      - run: pip install pytest
      - run: python -m pytest -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

name: release

# Pushing a `v*` tag (e.g. v0.1.0) builds static musl binaries for x86_64 and
# aarch64, which run on any distro or container whatever its glibc. The test
# suite runs against the x86_64 binary (the runner's arch); the aarch64 one is
# only checked to be static. Both go into a GitHub release with checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools bubblewrap gcc-aarch64-linux-gnu
      # Same as ci.yml: the runner's AppArmor userns restriction blocks bwrap.
      - name: Enable unprivileged user namespaces (bwrap needs them)
        # Same mounts as tallyrun; ci.yml explains the symlinks.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --symlink usr/bin /bin -- /bin/true && echo "bwrap sandbox OK"
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Build aarch64 (cross)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-musl
      # pytest runs target/release/tallyrun, so copy the musl build there and
      # test the binary that ships. cgroup and PMU asserts skip on GitHub
      # runners, as in ci.yml.
      - run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/tallyrun target/release/tallyrun
      - run: pip install pytest && python -m pytest -v
      - name: Package
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/tallyrun dist/tallyrun-x86_64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/tallyrun dist/tallyrun-aarch64-unknown-linux-musl
          # Fail the release if either binary isn't static.
          (ldd dist/tallyrun-x86_64-unknown-linux-musl 2>&1 || true) | grep -Eq 'not a dynamic|statically linked'
          file dist/tallyrun-aarch64-unknown-linux-musl | grep -Eq 'aarch64.*(statically linked|static-pie)'
          cd dist && sha256sum tallyrun-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "tallyrun $GITHUB_REF_NAME" \
            --generate-notes \
            dist/tallyrun-x86_64-unknown-linux-musl \
            dist/tallyrun-aarch64-unknown-linux-musl \
            dist/SHA256SUMS
